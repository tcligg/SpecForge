# GKE Batch Job: Regenerate training data for Gemma3-27B Eagle3.
#
# Gemma3-27B is NOT a thinking/reasoning model, so IS_REASONING_MODEL
# and THINKING_RATIO are disabled.
#
# This job runs 8 indexed pods in parallel.  Each pod launches SGLang
# servers and processes its assigned shard of *chunks* from the input
# dataset.  Chunk-based processing ensures preemption safety: completed
# chunks are marked with .done files, so a restarted pod skips them.
#
# All pods write to the same OUTPUT_DIR on GCSFuse.  Because each chunk
# produces its own output file (chunk_NNNNNN.jsonl), there are no
# write conflicts between pods.
#
# Prerequisites:
#   - GKE cluster with GPU node pool (H200 x8 spot instances)
#   - GCS FUSE CSI driver enabled
#   - Service account with GCS read/write access
#   - Datasets are auto-downloaded from HuggingFace by prepare_data.py
#   - HuggingFace token secret (for gated model access):
#       kubectl create secret generic hf-token --from-literal=token=hf_...
#
# Usage:
#   kubectl apply -f gke/regen-gemma3-27b.yaml
#
# Monitor:
#   kubectl get jobs regen-gemma3-27b -w
#   kubectl logs -l job-name=regen-gemma3-27b -f
#
# After completion, merge chunk outputs per dataset:
#   cat /gcs/pyc-eagle-data/datasets/gemma3-27b-regen/perfectblend_train/chunk_*.jsonl > perfectblend_regen.jsonl
#   cat /gcs/pyc-eagle-data/datasets/gemma3-27b-regen/translate-bp-dataset_train/chunk_*.jsonl > magpie-multilingual_regen.jsonl

apiVersion: batch/v1
kind: Job
metadata:
  name: regen-gemma3-27b
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimitPerIndex: 16
  maxFailedIndexes: 4
  template:
    metadata:
      namespace: default
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        cloud.google.com/gke-accelerator: nvidia-h200-141gb
        cloud.google.com/gke-accelerator-count: "8"
        cloud.google.com/gke-gpu-driver-version: "latest"
      containers:
      - name: regen
        image: us-central1-docker.pkg.dev/cloud-llm-test/tcli-test/specforge-regen:20260418-011202
        resources:
          limits:
            nvidia.com/gpu: 8
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: TOTAL_SHARDS
          value: "8"
        - name: MODEL
          value: "/gcs/pyc-eagle-data/models/gemma-3-27b-it"
        # Datasets to prepare and regenerate (comma-separated names
        # matching prepare_data.py --dataset choices)
        - name: DATASETS
          value: "magpie-multilingual,perfectblend"
        - name: PREPARE_DATA_DIR
          value: "/gcs/pyc-eagle-data/datasets/prepared"
        - name: OUTPUT_DIR
          value: "/gcs/pyc-eagle-data/datasets/gemma3-27b-regen"
        # Chunking — each chunk is the unit of retry on preemption
        - name: CHUNK_SIZE
          value: "500"
        # SGLang server configuration
        # Gemma3-27B is a dense 27B model — TP=1 fits on a single H200.
        - name: TP_SIZE
          value: "1"
        - name: NUM_SERVERS
          value: "8"
        - name: MEM_FRACTION_STATIC
          value: "0.85"
        # Regeneration parameters
        - name: CONCURRENCY
          value: "128"
        - name: MAX_TOKENS
          value: "2048"
        - name: TEMPERATURE
          value: "1"
        # Gemma3-27B is NOT a reasoning/thinking model
        - name: IS_REASONING_MODEL
          value: "false"
        volumeMounts:
        - name: gcsfuse
          mountPath: /gcs/pyc-eagle-data
        - name: dshm
          mountPath: /dev/shm
      restartPolicy: OnFailure
      serviceAccountName: embed-gen-ksa
      terminationGracePeriodSeconds: 120
      volumes:
      - name: gcsfuse
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: pyc-eagle-data
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "48Gi"
      tolerations:
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule
